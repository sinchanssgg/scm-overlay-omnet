[General]
network = SCMNetwork
cmdenv-express-mode = true
cmdenv-interactive = false
sim-time-limit = 30s
repeat = 3  # Run each scenario 3 times

# Record all signals as vectors and scalars
**.result-recording-modes = default,+vector
**.scalar-recording = true
**.vector-recording = true

# Network-level defaults
*.faultProbability = 0
*.faultInterval = 10s
*.numNodes = 10

# FaultInjector defaults (prevent unassigned parameter prompts)
*.faultInjector.faultType = 0
*.faultInjector.faultProbability = 0
*.faultInjector.interval = 10s
*.faultInjector.initialDelay = 5s
*.faultInjector.campaignMode = 0
*.faultInjector.campaignSeed = 1337
*.faultInjector.maxCampaignDepth = -1
*.faultInjector.campaignTargetDepth = -1
*.faultInjector.parentOffset = 1
*.faultInjector.strictDepthCampaign = true
*.faultInjector.sendFaultNotify = true

# Node defaults
*.node[*].linkCost = 1.0
*.node[*].algorithmVariant = "scm"

#---------------------------
# Baseline Configurations
#---------------------------

[Config BaselineCBT]
description = "Complete Binary Tree baseline"
network = CompleteBinaryTree
*.numNodes = 31  # 2^5-1
*.edgeFilePath = "${resultdir}/cbt_edges.txt"
*.faultInjector.faultProbability = 0

[Config MWE]
description = "Minimum working example for artifact evaluation"
network = CompleteBinaryTree
sim-time-limit = 12s
repeat = 1
*.numNodes = 1024
*.edgeFilePath = "${resultdir}/cbt_edges.txt"
*.faultInjector.faultProbability = 0

[Config BaselineER]
description = "Erdos-Renyi baseline"
network = ErdosRenyi
*.numNodes = 50
*.edgeFilePath = "${resultdir}/er_edges.txt"
*.connectionProbability = 0.2
*.faultInjector.faultProbability = 0

[Config BaselineTwitch]
description = "Twitch network baseline"
network = TwitchNetwork
*.numNodes = 256
*.edgeFilePath = "${resultdir}/twitch_edges.txt"
*.faultInjector.faultProbability = 0

#---------------------------
# Fault Injection Scenarios
#---------------------------

[Config FaultDistance]
extends = BaselineCBT
description = "Distance tampering faults"
*.faultInjector.faultType = 0  # DISTANCE_TAMPER
*.faultInjector.faultProbability = 0.1
*.faultInjector.interval = 10s

[Config FaultBeta]
extends = BaselineER
description = "Beta modification faults"
*.faultInjector.faultType = 1  # BETA_MODIFICATION
*.faultInjector.faultProbability = 0.15

[Config FaultParent]
extends = BaselineTwitch
description = "Parent switching faults"
*.faultInjector.faultType = 2  # PARENT_SWITCH
*.faultInjector.faultProbability = 0.05

#---------------------------
# Full topology x fault matrix scenarios (Sev-1 fidelity)
#---------------------------

[Config FaultBetaCBT]
extends = BaselineCBT
description = "CBT with beta modification faults"
*.faultInjector.faultType = 1  # BETA_MODIFICATION
*.faultInjector.faultProbability = 0.15

[Config FaultParentCBT]
extends = BaselineCBT
description = "CBT with parent switching faults"
*.faultInjector.faultType = 2  # PARENT_SWITCH
*.faultInjector.faultProbability = 0.05

[Config FaultDistanceER]
extends = BaselineER
description = "ER with distance tampering faults"
*.faultInjector.faultType = 0  # DISTANCE_TAMPER
*.faultInjector.faultProbability = 0.1
*.faultInjector.interval = 10s

[Config FaultParentER]
extends = BaselineER
description = "ER with parent switching faults"
*.faultInjector.faultType = 2  # PARENT_SWITCH
*.faultInjector.faultProbability = 0.05

[Config FaultDistanceTwitch]
extends = BaselineTwitch
description = "Twitch with distance tampering faults"
*.faultInjector.faultType = 0  # DISTANCE_TAMPER
*.faultInjector.faultProbability = 0.1
*.faultInjector.interval = 10s

[Config FaultBetaTwitch]
extends = BaselineTwitch
description = "Twitch with beta modification faults"
*.faultInjector.faultType = 1  # BETA_MODIFICATION
*.faultInjector.faultProbability = 0.15

#---------------------------
# Comparison Benchmarks
#---------------------------

[Config GargGrosu]
extends = BaselineCBT
description = "Comparison: Garg-Grosu algorithm"
*.node[*].algorithmVariant = "garg-grosu"

[Config Byrenheid]
extends = BaselineCBT
description = "Comparison: Byrenheid's algorithm"
*.node[*].algorithmVariant = "byrenheid"

#---------------------------
# Claim-A matrix scaffolding (deterministic fault campaign + algorithm variant tags)
#---------------------------

# Figure-2 style CBT depth sweep
[Config ClaimA_CBT_Baseline_D4]
extends = BaselineCBT
*.numNodes = 31

[Config ClaimA_CBT_FaultParent_D4]
extends = BaselineCBT
*.numNodes = 31
*.faultInjector.faultType = 2
*.faultInjector.campaignMode = 1
*.faultInjector.parentOffset = 1
*.faultInjector.maxCampaignDepth = 4
*.faultInjector.sendFaultNotify = false

[Config ClaimA_CBT_Baseline_D5]
extends = BaselineCBT
*.numNodes = 63

[Config ClaimA_CBT_FaultParent_D5]
extends = BaselineCBT
*.numNodes = 63
*.faultInjector.faultType = 2
*.faultInjector.campaignMode = 1
*.faultInjector.parentOffset = 1
*.faultInjector.maxCampaignDepth = 5
*.faultInjector.sendFaultNotify = false

[Config ClaimA_CBT_Baseline_D6]
extends = BaselineCBT
*.numNodes = 127

[Config ClaimA_CBT_FaultParent_D6]
extends = BaselineCBT
*.numNodes = 127
*.faultInjector.faultType = 2
*.faultInjector.campaignMode = 1
*.faultInjector.parentOffset = 1
*.faultInjector.maxCampaignDepth = 6
*.faultInjector.sendFaultNotify = false

# Figure-2 style ER size sweep
[Config ClaimA_ER_Baseline_N50]
extends = BaselineER
*.numNodes = 50
*.connectionProbability = 0.2

[Config ClaimA_ER_FaultBeta_N50]
extends = BaselineER
*.numNodes = 50
*.connectionProbability = 0.2
*.faultInjector.faultType = 1
*.faultInjector.faultProbability = 0.15

[Config ClaimA_ER_Baseline_N100]
extends = BaselineER
*.numNodes = 100
*.connectionProbability = 0.12

[Config ClaimA_ER_FaultBeta_N100]
extends = BaselineER
*.numNodes = 100
*.connectionProbability = 0.12
*.faultInjector.faultType = 1
*.faultInjector.faultProbability = 0.15

# Figure-5 style algorithm variants
[Config ClaimA_CBT_FaultParent_D5_GargStub]
extends = ClaimA_CBT_FaultParent_D5
*.node[*].algorithmVariant = "garg-grosu"
*.faultInjector.parentOffset = 2

[Config ClaimA_CBT_FaultParent_D5_ByrenheidStub]
extends = ClaimA_CBT_FaultParent_D5
*.node[*].algorithmVariant = "byrenheid"
*.faultInjector.parentOffset = 2

[Config ClaimA_Twitch_FaultParent_N256]
extends = BaselineTwitch
*.numNodes = 256
*.faultInjector.faultType = 2
*.faultInjector.faultProbability = 0.05

#---------------------------
# Figure 2: per-depth parent-manipulation experiment
#---------------------------

[Config Fig2_CBT_FaultParent]
extends = BaselineCBT
description = "Fig2 CBT: single-depth parent corruption"
repeat = 1
*.faultInjector.faultType = 2
*.faultInjector.campaignMode = 1
*.faultInjector.parentOffset = 1
*.faultInjector.sendFaultNotify = false
*.faultInjector.interval = 999s
*.faultInjector.campaignTargetDepth = -1

[Config Fig2_ER_FaultParent]
extends = BaselineER
description = "Fig2 ER: single-depth parent corruption"
repeat = 1
*.faultInjector.faultType = 2
*.faultInjector.campaignMode = 1
*.faultInjector.parentOffset = 1
*.faultInjector.sendFaultNotify = false
*.faultInjector.interval = 999s
*.faultInjector.campaignTargetDepth = -1
*.faultInjector.strictDepthCampaign = false

[Config Fig2_Twitch_FaultParent]
extends = BaselineTwitch
description = "Fig2 Twitch: single-depth parent corruption"
repeat = 1
*.faultInjector.faultType = 2
*.faultInjector.campaignMode = 1
*.faultInjector.parentOffset = 1
*.faultInjector.sendFaultNotify = false
*.faultInjector.interval = 999s
*.faultInjector.campaignTargetDepth = -1
*.faultInjector.strictDepthCampaign = false