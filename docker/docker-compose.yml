# docker-compose.yml — Orchestration for SCM simulation container
# Author: Sinchan Sengupta <sinchan.sengupta@univ-nantes.fr>
# Modified By: Arannya Mukherjee <arannya@adhrith.ai>

services:
  simulation:
    image: scm-overlay-omnet:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../results:/workspace/results
    environment:
      - RESULT_DIR=/workspace/results/latest
    command: ["/workspace/scripts/run_experiments.sh", "--skip-sim-build"]
volumes:
  results:
