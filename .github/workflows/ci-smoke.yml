name: ci-smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preprocess-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run preprocessing tests
        run: uv run python -m unittest tests/test_preprocess.py -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t scm-overlay-omnet:ci .

      - name: Run quick pipeline in container
        run: |
          mkdir -p "$RUNNER_TEMP/scm-results"
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            -e RESULT_DIR=/tmp/results \
            -e SCM_RANDOM_SEED=1337 \
            scm-overlay-omnet:ci \
            /bin/bash -lc "cd /workspace && ./scripts/run_experiments.sh --skip-sim-build"

      - name: Validate default pipeline outputs
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            scm-overlay-omnet:ci \
            /workspace/.venv/bin/python \
            /workspace/scripts/analysis/validate_outputs.py /tmp/results --require-columns scenario,value_mean,value_std,value_count,time_max --require-non-empty

      - name: Validate claim-b fig5 smoke output
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            -e RESULT_DIR=/tmp/results \
            -e SCM_RANDOM_SEED=1337 \
            scm-overlay-omnet:ci \
            /bin/bash -lc "cd /workspace && ./scripts/run_experiments.sh --claim-b --quick --skip-sim-build"
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            scm-overlay-omnet:ci \
            /workspace/.venv/bin/python \
            /workspace/scripts/analysis/build_fig5_outputs.py /tmp/results/fig5-smoke --result-root /tmp/results/claim-b
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            scm-overlay-omnet:ci \
            /workspace/.venv/bin/python \
            /workspace/scripts/analysis/validate_outputs.py /tmp/results/fig5-smoke --require-columns topology,depth,algorithm,rounds_to_converge,correct_convergence --require-non-empty
