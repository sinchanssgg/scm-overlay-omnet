# ci-smoke.yml — CI workflow for preprocessing tests and Docker smoke tests
# Author: Sinchan Sengupta <sinchan.sengupta@univ-nantes.fr>
# Modified By: Arannya Mukherjee <arannya@adhrith.ai>

name: ci-smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preprocess-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run preprocessing tests
        run: uv run python -m unittest tests/test_preprocess.py -v

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t scm-overlay-omnet:ci .

      - name: Run quick pipeline in container
        run: |
          mkdir -p "$RUNNER_TEMP/scm-results"
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            -e RESULT_DIR=/tmp/results \
            -e SCM_RANDOM_SEED=1337 \
            scm-overlay-omnet:ci \
            /bin/bash -lc "cd /workspace && ./scripts/run_experiments.sh --skip-sim-build"

      - name: Validate default pipeline outputs
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            scm-overlay-omnet:ci \
            /workspace/.venv/bin/python \
            /workspace/scripts/analysis/validate_outputs.py /tmp/results --require-columns scenario,value_mean,value_std,value_count,time_max --require-non-empty

      - name: Validate claim-b fig5 smoke output
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            -e RESULT_DIR=/tmp/results \
            -e SCM_RANDOM_SEED=1337 \
            scm-overlay-omnet:ci \
            /bin/bash -lc "cd /workspace && ./scripts/run_experiments.sh --claim-b --quick --skip-sim-build"
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            scm-overlay-omnet:ci \
            /workspace/.venv/bin/python \
            /workspace/scripts/analysis/build_fig5_outputs.py /tmp/results/fig5-smoke --result-root /tmp/results/claim-b
          docker run --rm \
            -v "$RUNNER_TEMP/scm-results:/tmp/results" \
            scm-overlay-omnet:ci \
            /workspace/.venv/bin/python \
            /workspace/scripts/analysis/validate_outputs.py /tmp/results/fig5-smoke --require-columns topology,depth,algorithm,rounds_to_converge,correct_convergence --require-non-empty

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-results
          path: ${{ runner.temp }}/scm-results/
          retention-days: 7

      - name: Post results summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = process.env.RUNNER_TEMP + '/scm-results';

            let body = '## CI Smoke Test Results\n\n';

            // Default pipeline analysis.csv
            const csvPath = path.join(resultsDir, 'analysis.csv');
            if (fs.existsSync(csvPath)) {
              const csv = fs.readFileSync(csvPath, 'utf8').trim();
              const lines = csv.split('\n');
              if (lines.length > 1) {
                const header = lines[0].split(',');
                body += '### Default Pipeline\n\n';
                body += '| ' + header.join(' | ') + ' |\n';
                body += '| ' + header.map(() => '---').join(' | ') + ' |\n';
                lines.slice(1).forEach(line => {
                  body += '| ' + line.split(',').join(' | ') + ' |\n';
                });
                body += '\n';
              }
            } else {
              body += '> Default pipeline `analysis.csv` not found\n\n';
            }

            // Fig5 smoke analysis.csv
            const fig5Path = path.join(resultsDir, 'fig5-smoke', 'analysis.csv');
            if (fs.existsSync(fig5Path)) {
              const csv = fs.readFileSync(fig5Path, 'utf8').trim();
              const lines = csv.split('\n');
              if (lines.length > 1) {
                const header = lines[0].split(',');
                body += '### Figure 5 (Claim B)\n\n';
                body += '| ' + header.join(' | ') + ' |\n';
                body += '| ' + header.map(() => '---').join(' | ') + ' |\n';
                lines.slice(1).forEach(line => {
                  body += '| ' + line.split(',').join(' | ') + ' |\n';
                });
                body += '\n';
              }
            }

            // Link to artifacts
            body += `\n📎 [Download full artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) (plots, .vec files, CSVs)\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
